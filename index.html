<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fractal Explorer — WebGL Prototype</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">

<!-- iOS Safari ignores the manifest entirely for install/homescreen purposes
     and needs its own meta tags + a dedicated (non-transparent) icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fractal">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* Every UI font size is in rem, so they all scale together off this one
     root size. --text-scale stays 1 (no change) for now; following the
     iOS Larger Text setting needs native Swift (read UIContentSizeCategory,
     evaluateJavaScript to set --text-scale on documentElement.style) — a
     plain web build can't see that setting. See TODO.md. */
  :root { --text-scale: 1; font-size: calc(16px * var(--text-scale)); }
  html, body {
    margin: 0; padding: 0; background: #111; height: 100%;
    overflow: hidden; touch-action: none;
  }
  body { font: 0.75rem/1.4 -apple-system, system-ui, sans-serif; color: #ddd; }
  /* position:relative anchors #controls, which floats over the bottom of
     #canvasArea instead of taking its own slice of the column. */
  body { display: flex; flex-direction: column; position: relative; }

  /* apple-mobile-web-app-status-bar-style=black-translucent (see <head>)
     makes iOS draw the status bar transparently over page content instead
     of reserving space for it, so content pinned to the very top — like
     the HUD — renders underneath the notch/Dynamic Island and is invisible
     in standalone (Add to Home Screen) mode. viewport-fit=cover in the
     viewport meta tag is what makes env(safe-area-inset-*) available here;
     padding it in explicitly pushes content back below the safe area. This
     resolves to 0 in a normal browser tab, so it's a no-op there. */
  #errorBanner {
    flex: none; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top));
    background: #6b1414; color: #fff;
    font: 0.75rem/1.5 -apple-system, system-ui, monospace; white-space: pre-wrap;
    word-break: break-word; max-height: 40vh; overflow-y: auto; z-index: 100;
  }

  /* A true overlay: absolutely positioned inside #canvasArea, so showing or
     hiding it never resizes the canvas or shifts the fractal. Its own dark
     card keeps the text legible over whatever is drawn beneath it. Offsets
     are measured from #canvasArea's padding box, so the safe-area insets
     are added back in to keep it clear of the notch (see #errorBanner
     above). pointer-events: none lets pans/pinches that start on the card
     go through to the canvas underneath. */
  #hud {
    position: absolute; z-index: 10; pointer-events: none;
    top: calc(8px + env(safe-area-inset-top));
    left: calc(8px + env(safe-area-inset-left));
    max-width: calc(100% - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
    box-sizing: border-box;
    padding: 6px 10px; border-radius: 8px; /* matches button radius */
    background: rgba(0,0,0,0.7);
  }
  #hud .hudName {
    font: 600 0.875rem/1.3 -apple-system, system-ui, sans-serif; color: #fff;
  }
  /* pre-wrap, not pre: keep the explicit line breaks and column spacing,
     but wrap a long line instead of running it off a phone's right edge. */
  #hud .hudStats {
    font: 0.6875rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9a9a9a; white-space: pre-wrap;
  }

  /* The canvas area is always the topmost in-flow content (the HUD floats
     over it), so it clears the iOS status bar/notch in standalone mode
     itself (see the #errorBanner comment above); otherwise the top of every
     fractal draws under the clock. Resolves to 0 in a normal browser tab. */
  #canvasArea {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: row;
    background: #000; position: relative; gap: 2px;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    box-sizing: border-box;
  }
  #canvasArea.stacked { flex-direction: column; }
  #mainCanvas, #juliaCanvas, #kochCanvas, #treeCanvas, #dragonCanvas, #fernCanvas {
    flex: 1 1 0; min-width: 0; min-height: 0; width: 100%; height: 100%;
    touch-action: none; display: block;
  }
  .hidden { display: none !important; }

  #boxZoomRect {
    position: fixed; border: 1px dashed #6cf; background: rgba(100,200,255,0.15);
    pointer-events: none; z-index: 20;
  }
  #crosshair {
    position: fixed; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border: 2px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    pointer-events: none; z-index: 20;
  }

  /* Frosted toolbar, in the spirit of iOS's thin dark chrome material: it
     floats over the bottom of the canvas (absolute, so #canvasArea runs the
     full height behind it) and blurs whatever is drawn there instead of
     hiding it under a flat scrim. Showing/hiding rows never resizes the
     canvas either, for the same reason the HUD is an overlay. Browsers
     without backdrop-filter get a near-opaque fill instead, so the icons
     stay legible over busy fractal detail. z-index keeps the toolbar and
     its popovers (z 30 inside this stacking context) above the crosshair
     and box-zoom rectangle (z 20). */
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 25;
    background: rgba(22,22,24,0.9);
    border-top: 0.5px solid rgba(255,255,255,0.14);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    #controls {
      background: rgba(40,40,44,0.55);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
    }
  }
  /* gap/padding sized so the busiest row (7 x 44px buttons) stays on one
     line down to 360px-wide phones: 7*44 + 6*6 = 344 = 360 - 2*8. */
  .control-row {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px 8px;
  }
  .control-row:not(:last-child) { border-bottom: 0.5px solid rgba(255,255,255,0.1); }
  #fractalControls.hidden, #kochControls.hidden, #treeControls.hidden,
  #dragonControls.hidden, #fernControls.hidden { display: none; }

  /* Fractal-type picker: a dropdown panel opened by the hamburger button,
     not a permanently-visible row — the row (even scrollable) still ate
     screen space at all times for something only touched occasionally.
     position:absolute takes it out of #controls' normal flex flow
     entirely, so opening/closing it never resizes the canvas the way the
     old wrapping row did (the same kind of layout churn that broke
     box-zoom coordinates earlier — nothing here can trigger that class of
     bug even by accident, since it never affects layout at all). */
  #fractalTypeRow {
    position: absolute; left: 10px; right: 10px; bottom: 100%;
    margin-bottom: 8px; padding: 10px;
    display: none; flex-wrap: wrap; gap: 8px;
    max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #1c1c1c; border: 1px solid #444; border-radius: 10px;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.5);
    z-index: 30;
  }
  #fractalTypeRow.open { display: flex; }
  /* Share popover: same open-class pattern and out-of-flow positioning as
     #fractalTypeRow, so opening it never reflows the control rows. */
  #shareMenu {
    position: absolute; right: 10px; bottom: 100%; margin-bottom: 8px;
    padding: 8px; display: none; flex-direction: column; gap: 6px;
    background: #1c1c1c; border: 1px solid #444; border-radius: 10px;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.5); z-index: 30;
  }
  #shareMenu.open { display: flex; }
  /* Colormap picker: same popover pattern, anchored left like the fractal
     picker. Each item is a name plus a gradient strip of the colormap. */
  #colormapMenu {
    position: absolute; left: 10px; bottom: 100%; margin-bottom: 8px;
    padding: 8px; display: none; flex-direction: column; gap: 6px;
    max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #1c1c1c; border: 1px solid #444; border-radius: 10px;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.5); z-index: 30;
  }
  #colormapMenu.open { display: flex; }
  #colormapMenu button {
    display: flex; align-items: center; gap: 10px; text-align: left;
    min-width: 200px;
  }
  #colormapMenu .cmSwatch {
    flex: 0 0 90px; height: 16px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #shareMenu button { text-align: left; }
  .fractalMenuBtn { max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }

  /* Section headers labeling the picker's two parts (Infinite Zoom,
     Beautiful Patterns) — flex:1 1 100% forces each onto its own line
     within the wrapping flex panel, same trick used for label.field
     earlier. Spacing only, no rule line: one menu with two labeled parts,
     not two menus. */
  #fractalTypeRow .menuSectionHeader {
    flex: 1 1 100%;
    font: 0.6875rem -apple-system, system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: #888; padding: 4px 2px;
  }
  #fractalTypeRow .menuSectionHeader:not(:first-child) {
    margin-top: 10px;
  }

  /* Sliders get a row to themselves — cramming them alongside 4-5 buttons
     on a 375-430px phone width forced awkward wraps and mis-taps. */
  label.field {
    flex: 1 1 100%; display: flex; align-items: center; gap: 10px; min-height: 44px;
  }

  button {
    font: 0.8125rem -apple-system, system-ui, sans-serif; padding: 10px 14px;
    min-height: 44px; min-width: 44px; box-sizing: border-box;
    background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 8px;
    white-space: nowrap; -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, background-color 0.08s ease;
  }
  button.active { background: #3a6ea5; border-color: #6cf; }
  button:disabled { opacity: 0.35; }
  /* Explicit tap feedback since -webkit-tap-highlight-color is disabled above
     (its default flash looks janky over the app's dark chrome). */
  button:active { transform: scale(0.95); background: #3a3a3a; }
  button.active:active { background: #2f5a86; }

  /* Icon-only buttons: fixed square (still the same 44px touch target),
     no text padding, SVG centered via flex. currentColor on the SVG
     strokes means .active/:active's existing background/border changes
     are all that's needed for icon buttons to show state -- no separate
     icon color rules. */
  /* Width flexes rather than being fixed: buttons share the row evenly up
     to 44px each, so a full row (9 on Mandelbrot) stays on one line on
     phones instead of wrapping into a third toolbar row. Height stays
     44px, so the tap target only narrows (to ~36px at 360px wide). */
  .iconBtn {
    width: auto; height: 44px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 1 1 0; min-width: 32px; max-width: 44px;
    /* Glyph-on-glass rather than opaque gray tiles: a faint white fill reads
       as a control on the frosted toolbar without boxing every icon in.
       The border stays (transparent) so the 44px box is unchanged. */
    background: rgba(255,255,255,0.08); border-color: transparent; color: #f2f2f7;
  }
  .iconBtn:active { background: rgba(255,255,255,0.18); }
  .iconBtn.active { background: #3a6ea5; border-color: #6cf; }
  .iconBtn.active:active { background: #2f5a86; }
  .iconBtn svg { width: 20px; height: 20px; display: block; }

  input[type=range] {
    flex: 1 1 80px; min-width: 60px; height: 44px; margin: 0;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  /* iOS UISlider look: the track is filled in the accent color from the
     minimum up to the thumb and dim gray after it, with a plain white
     thumb. A track pseudo-element can't read the value, so app.js keeps
     --fill (the thumb's position, 0-100%) in sync on each slider. */
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #6cf 0%, #6cf var(--fill, 0%), #444 var(--fill, 0%), #444 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: #fff; border: none;
    box-shadow: 0 0.5px 4px rgba(0,0,0,0.35), 0 3px 8px rgba(0,0,0,0.2);
    margin-top: -11px; /* (28 - 6) / 2, centers thumb on the 6px track */
  }
  /* Must stay the last rule in this sheet: it overrides .control-row at
     equal specificity. Narrow phones: tighter gaps so the busiest row (9
     buttons on Mandelbrot) fits one line down to 360px:
     9*36 + 8*3 = 348 = 360 - 2*6. */
  @media (max-width: 410px) {
    .control-row { gap: 3px; padding: 8px 6px; }
  }
</style>
</head>
<body>
<div id="errorBanner" class="hidden"></div>
<script>
  // Surfaces otherwise-silent JS errors directly on the page — there's no
  // remote devtools access available while testing this on a phone, so
  // errors need to be visible on-device rather than only in a console.
  function reportError(text) {
    const el = document.getElementById("errorBanner");
    el.textContent = (el.classList.contains("hidden") ? "" : el.textContent + "\n---\n") + text;
    el.classList.remove("hidden");
  }
  window.addEventListener("error", (e) => {
    reportError(`JS Error: ${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}`);
  });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    reportError(`Unhandled rejection: ${r && r.message ? r.message : r}`);
  });
</script>
<div id="canvasArea">
  <div id="hud" class="hidden"><div class="hudName"></div><div class="hudStats"></div></div>
  <canvas id="mainCanvas"></canvas>
  <canvas id="juliaCanvas" class="hidden"></canvas>
  <canvas id="kochCanvas" class="hidden"></canvas>
  <canvas id="treeCanvas" class="hidden"></canvas>
  <canvas id="dragonCanvas" class="hidden"></canvas>
  <canvas id="fernCanvas" class="hidden"></canvas>
</div>
<div id="boxZoomRect" class="hidden"></div>
<div id="crosshair" class="hidden"></div>

<div id="controls">
  <div id="fractalTypeRow"></div>
  <div id="colormapMenu" role="menu" aria-label="Choose colormap"></div>
  <div id="shareMenu" role="menu">
    <button id="shareSaveBtn" role="menuitem">Save image</button>
    <button id="shareCopyBtn" role="menuitem">Copy link</button>
    <button id="shareNativeBtn" role="menuitem" class="hidden">Share…</button>
  </div>
  <div id="fractalControls" class="control-row">
    <label id="iterField" class="field">iter <input id="iterSlider" type="range" min="50" max="2000" step="10" value="300"></label>
    <button class="iconBtn fractalMenuBtn" aria-haspopup="true" aria-label="Choose fractal type" title="Choose fractal type">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
        <rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>
      </svg>
    </button>
    <button id="dualBtn" class="iconBtn" aria-label="Toggle dual (Julia) view" title="Toggle dual (Julia) view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3.5" width="16" height="7" rx="2"/><rect x="4" y="13.5" width="16" height="7" rx="2"/>
      </svg>
    </button>
    <button id="colormapBtn" class="iconBtn" aria-label="Choose colormap" title="Choose colormap">
      <svg viewBox="0 0 24 24">
        <circle cx="9" cy="9" r="6" fill="#e33" fill-opacity="0.75"/>
        <circle cx="15" cy="9" r="6" fill="#3c3" fill-opacity="0.75"/>
        <circle cx="12" cy="15" r="6" fill="#33e" fill-opacity="0.75"/>
      </svg>
    </button>
    <button id="hudBtn" class="iconBtn hudToggleBtn" aria-label="Toggle info overlay" title="Toggle info overlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/>
        <circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button id="boxZoomBtn" class="iconBtn" aria-label="Box zoom" title="Box zoom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V6a2 2 0 0 1 2-2h3"/><path d="M15 4h3a2 2 0 0 1 2 2v3"/>
        <path d="M20 15v3a2 2 0 0 1-2 2h-3"/><path d="M9 20H6a2 2 0 0 1-2-2v-3"/>
      </svg>
    </button>
    <button id="backBtn" class="iconBtn" aria-label="Back" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>
      </svg>
    </button>
    <button id="teleportBtn" class="iconBtn" aria-label="Surprise me" title="Surprise me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 3.5l1.7 5.3 5.3 1.7-5.3 1.7-1.7 5.3-1.7-5.3-5.3-1.7 5.3-1.7z"/>
        <path d="M18 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <button id="shareBtn" class="iconBtn shareBtn" aria-label="Share" title="Share" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5V14"/><path d="M8 7.5l4-4 4 4"/>
        <path d="M8.5 10.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5a2 2 0 0 0-2-2h-1.5"/>
      </svg>
    </button>
    <button id="resetBtn" class="iconBtn" aria-label="Reset view" title="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4v5h5"/>
      </svg>
    </button>
  </div>
  <div id="kochControls" class="control-row hidden">
    <label class="field">depth <input id="kochDepthSlider" type="range" min="0" max="8" step="1" value="4"></label>
    <button class="iconBtn fractalMenuBtn" aria-haspopup="true" aria-label="Choose fractal type" title="Choose fractal type">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
        <rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>
      </svg>
    </button>
    <button id="kochAnimateBtn" class="iconBtn" aria-label="Animate depth" title="Animate depth">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 5v14l12-7z"/></svg>
    </button>
    <button id="kochFillBtn" class="iconBtn active" aria-label="Toggle fill" title="Toggle fill">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2.5"/></svg>
    </button>
    <button id="kochColormapBtn" class="iconBtn" aria-label="Choose colormap" title="Choose colormap">
      <svg viewBox="0 0 24 24">
        <circle cx="9" cy="9" r="6" fill="#e33" fill-opacity="0.75"/>
        <circle cx="15" cy="9" r="6" fill="#3c3" fill-opacity="0.75"/>
        <circle cx="12" cy="15" r="6" fill="#33e" fill-opacity="0.75"/>
      </svg>
    </button>
    <button id="kochHudBtn" class="iconBtn hudToggleBtn" aria-label="Toggle info overlay" title="Toggle info overlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/>
        <circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button id="kochBackBtn" class="iconBtn" aria-label="Back" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>
      </svg>
    </button>
    <button id="kochShareBtn" class="iconBtn shareBtn" aria-label="Share" title="Share" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5V14"/><path d="M8 7.5l4-4 4 4"/>
        <path d="M8.5 10.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5a2 2 0 0 0-2-2h-1.5"/>
      </svg>
    </button>
    <button id="kochResetBtn" class="iconBtn" aria-label="Reset view" title="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4v5h5"/>
      </svg>
    </button>
  </div>
  <div id="treeControls" class="control-row hidden">
    <label class="field">depth <input id="treeDepthSlider" type="range" min="0" max="12" step="1" value="9"></label>
    <button class="iconBtn fractalMenuBtn" aria-haspopup="true" aria-label="Choose fractal type" title="Choose fractal type">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
        <rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>
      </svg>
    </button>

<script>
  // Service workers only register on secure origins or localhost, so this is
  // a silent no-op during phone-over-LAN dev testing (plain http://<lan-ip>)
  // and only takes effect once this is actually deployed behind HTTPS.
  // The iOS app bundles its files, so it has no use for one.
  if ("serviceWorker" in navigator && !Platform.isNative) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        reportError(`Service worker registration failed: ${err.message}`);
      });
    });
  }
</script>
