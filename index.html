<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fractal Explorer — WebGL Prototype</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">

<!-- iOS Safari ignores the manifest entirely for install/homescreen purposes
     and needs its own meta tags + a dedicated (non-transparent) icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fractal">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body {
    margin: 0; padding: 0; background: #111; height: 100%;
    overflow: hidden; touch-action: none;
    font: 12px/1.4 -apple-system, system-ui, sans-serif; color: #ddd;
  }
  body { display: flex; flex-direction: column; }

  /* apple-mobile-web-app-status-bar-style=black-translucent (see <head>)
     makes iOS draw the status bar transparently over page content instead
     of reserving space for it, so content pinned to the very top — like
     the HUD — renders underneath the notch/Dynamic Island and is invisible
     in standalone (Add to Home Screen) mode. viewport-fit=cover in the
     viewport meta tag is what makes env(safe-area-inset-*) available here;
     padding it in explicitly pushes content back below the safe area. This
     resolves to 0 in a normal browser tab, so it's a no-op there. */
  #errorBanner {
    flex: none; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top));
    background: #6b1414; color: #fff;
    font: 12px/1.5 -apple-system, system-ui, monospace; white-space: pre-wrap;
    word-break: break-word; max-height: 40vh; overflow-y: auto; z-index: 100;
  }

  #hud {
    flex: none; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
    font: 12px/1.4 -apple-system, system-ui, monospace;
    background: rgba(0,0,0,0.45); white-space: pre;
  }

  #canvasArea {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: row;
    background: #000; position: relative; gap: 2px;
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    box-sizing: border-box;
  }
  #canvasArea.stacked { flex-direction: column; }
  #mainCanvas, #juliaCanvas, #kochCanvas {
    flex: 1 1 0; min-width: 0; min-height: 0; width: 100%; height: 100%;
    touch-action: none; display: block;
  }
  .hidden { display: none !important; }

  #boxZoomRect {
    position: fixed; border: 1px dashed #6cf; background: rgba(100,200,255,0.15);
    pointer-events: none; z-index: 20;
  }
  #crosshair {
    position: fixed; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border: 2px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    pointer-events: none; z-index: 20;
  }

  #controls {
    flex: none; background: rgba(0,0,0,0.45);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .control-row {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 8px 10px;
  }
  .control-row:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.08); }
  #fractalTypeRow.hidden, #fractalControls.hidden, #kochControls.hidden { display: none; }

  /* The type-selector row (8 fractal buttons) used to wrap onto two lines,
     eating canvas space and causing the kind of mid-gesture layout shift
     that broke box-zoom coordinate math earlier. Scrolling horizontally
     instead keeps it to one fixed-height row. */
  #fractalTypeRow {
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  #fractalTypeRow button { flex: 0 0 auto; scroll-snap-align: start; }

  /* Sliders get a row to themselves — cramming them alongside 4-5 buttons
     on a 375-430px phone width forced awkward wraps and mis-taps. */
  label.field {
    flex: 1 1 100%; display: flex; align-items: center; gap: 10px; min-height: 44px;
  }

  button {
    font: 13px -apple-system, system-ui, sans-serif; padding: 10px 14px;
    min-height: 44px; min-width: 44px; box-sizing: border-box;
    background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 8px;
    white-space: nowrap; -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, background-color 0.08s ease;
  }
  button.active { background: #3a6ea5; border-color: #6cf; }
  button:disabled { opacity: 0.35; }
  /* Explicit tap feedback since -webkit-tap-highlight-color is disabled above
     (its default flash looks janky over the app's dark chrome). */
  button:active { transform: scale(0.95); background: #3a3a3a; }
  button.active:active { background: #2f5a86; }

  input[type=range] {
    flex: 1 1 80px; min-width: 60px; height: 44px; margin: 0;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px; background: #444;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: #6cf; border: 2px solid #1a1a1a;
    margin-top: -11px; /* (28 - 6) / 2, centers thumb on the 6px track */
  }
</style>
</head>
<body>
<div id="errorBanner" class="hidden"></div>
<script>
  // Surfaces otherwise-silent JS errors directly on the page — there's no
  // remote devtools access available while testing this on a phone, so
  // errors need to be visible on-device rather than only in a console.
  function reportError(text) {
    const el = document.getElementById("errorBanner");
    el.textContent = (el.classList.contains("hidden") ? "" : el.textContent + "\n---\n") + text;
    el.classList.remove("hidden");
  }
  window.addEventListener("error", (e) => {
    reportError(`JS Error: ${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}`);
  });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    reportError(`Unhandled rejection: ${r && r.message ? r.message : r}`);
  });
</script>
<div id="hud"></div>

<div id="canvasArea">
  <canvas id="mainCanvas"></canvas>
  <canvas id="juliaCanvas" class="hidden"></canvas>
  <canvas id="kochCanvas" class="hidden"></canvas>
</div>
<div id="boxZoomRect" class="hidden"></div>
<div id="crosshair" class="hidden"></div>

<div id="controls">
  <div class="control-row">
    <button id="modeFractalBtn" class="active">Fractals</button>
    <button id="modeKochBtn">Koch Snowflake</button>
  </div>
  <div id="fractalTypeRow" class="control-row"></div>
  <div id="fractalControls" class="control-row">
    <label class="field">iter <input id="iterSlider" type="range" min="50" max="2000" step="10" value="300"></label>
    <button id="colormapBtn">Colormap</button>
    <button id="dualBtn">Dual</button>
    <button id="boxZoomBtn">Box Zoom</button>
    <button id="backBtn">&larr; Back</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div id="kochControls" class="control-row hidden">
    <label class="field">depth <input id="kochDepthSlider" type="range" min="0" max="8" step="1" value="4"></label>
    <button id="kochAnimateBtn">Animate</button>
    <button id="kochFillBtn" class="active">Fill</button>
    <button id="kochColormapBtn">Colormap</button>
    <button id="kochResetBtn">Reset</button>
  </div>
</div>

<script src="colormaps.js"></script>
<script src="shaders.js"></script>
<script src="koch.js"></script>
<script src="app.js"></script>
<script>
  // Service workers only register on secure origins or localhost, so this is
  // a silent no-op during phone-over-LAN dev testing (plain http://<lan-ip>)
  // and only takes effect once this is actually deployed behind HTTPS.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        reportError(`Service worker registration failed: ${err.message}`);
      });
    });
  }
</script>
</body>
</html>
